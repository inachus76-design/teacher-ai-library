<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쌤에게 배워, 우리반에 심다</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7ee;color:#243b30;font:16px/1.65 system-ui,sans-serif}main{max-width:910px;margin:auto;padding:clamp(16px,5vw,48px)}header{background:#e5edde;border:1px solid #d4e0d0;border-radius:32px;padding:clamp(22px,6vw,52px);position:relative;overflow:hidden}header svg{position:absolute;right:18px;bottom:0;width:25%;height:auto;opacity:.42;pointer-events:none}header>*:not(svg){position:relative}h1{font-size:clamp(28px,6vw,54px);line-height:1.16;letter-spacing:-.06em;margin:14px 0}h1 span{display:block}h2,h3,p{margin:0 0 10px}p{color:#4c6255}.eyebrow,.badge{font-size:.82rem;font-weight:750;display:inline-block;background:#ecf1df;border-radius:30px;padding:4px 12px}.eyebrow{background:#fff9df}section{margin:26px 0}label{font-weight:700}input,button,a.action,summary{font:inherit}input{border:1px solid #bacbbc;border-radius:12px;background:white;color:inherit;padding:10px 13px;min-width:0;min-height:44px}#search{display:block;width:100%;margin:6px 0 20px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1 1 135px}button,a.action{cursor:pointer;border:1px solid #c6d4c7;border-radius:12px;padding:9px 15px;min-height:44px;background:white;color:#244132;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button[aria-pressed=true],button.primary{color:white;background:#204c39;border-color:#204c39}button:hover,a.action:hover{box-shadow:0 0 0 2px #9cbba6}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #607f37;outline-offset:3px}article,#manage{border:1px solid #dce3d6;border-radius:24px;background:white;padding:clamp(16px,4vw,30px);margin:12px 0;box-shadow:0 5px 16px #26463208}article h3{font-size:clamp(21px,4vw,29px);line-height:1.35;margin-top:10px}summary{cursor:pointer;font-weight:750;padding:10px 0;min-height:44px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5ed;border-radius:12px;padding:16px;margin:0 0 12px}.group{margin-bottom:14px}.group h3{font-size:1rem}.editor{border:1px solid #dce3d6;border-radius:14px;padding:12px;margin:12px 0}.editor form{margin:8px 0}.child{margin-left:14px!important}.danger{color:#923c32}#status{min-height:1.65em;margin-top:6px}.muted{font-size:.9rem}.copy-fallback{width:100%;min-height:90px;margin-top:10px}
#resourceAdmin{border:1px solid #dce3d6;border-radius:24px;background:white;padding:clamp(16px,4vw,30px);margin:12px 0}
.resource-form{display:grid;gap:8px}
.resource-form :is(select,textarea){width:100%;min-height:44px;font:inherit;color:inherit;background:white;border:1px solid #bacbbc;border-radius:12px;padding:10px 13px}
.resource-form textarea{min-height:180px;resize:vertical}
.resource-form button{justify-self:start}
.attachments{margin-top:18px;border-top:1px solid #dce3d6;padding-top:12px}
.attachments .row{margin:8px 0}
.attachments a,.attachments input{max-width:100%;overflow-wrap:anywhere}
.attachments input[type=file]{width:100%}
</style>
<main>
<header>
<svg aria-hidden="true" viewBox="0 0 170 170"><path fill="none" stroke="#719573" stroke-width="4" d="M85 170Q77 107 122 48M84 151Q78 117 46 96"/><path fill="#98ad80" d="M99 87Q96 29 153 18Q161 72 99 87M78 131Q27 133 18 76Q71 75 78 131"/><circle fill="#d9b869" cx="46" cy="40" r="10"/></svg>
<span class="eyebrow">🌱 유치원 교사를 위한 AI 연수 자료실</span>
<h1><span>쌤에게 배워,</span> <span>우리반에 심다</span></h1>
<p>연수에서 배운 아이디어를 우리 반에서 바로 써 보세요.</p>
</header>
<section id="account" hidden aria-label="교사 계정">
<div id="accountForm" class="row">
<input id="username" aria-label="교사 아이디" placeholder="아이디 (영문·숫자 3자 이상)" autocomplete="username">
<input id="password" aria-label="비밀번호" placeholder="비밀번호 (12자 이상)" type="password">
<button type="button" id="login">로그인</button>
<button type="button" id="signup">교사 가입</button>
</div>
<div id="accountLinks" class="row"></div>
<p id="cloudStatus" role="status"></p>
</section>
<section aria-label="연수자료">
<label for="search">자료 검색</label>
<input id="search" type="search" placeholder="예: 그림자, 숲놀이, 체크리스트">
<nav id="menus" aria-label="연수자료 메뉴"></nav>
<h2 id="resultsTitle">연수 자료</h2>
<div id="cards"></div>
<p id="status" role="status"></p>
</section>
<details id="resourceAdmin">
<summary>연수자료 관리</summary>
<form id="resourceForm" class="resource-form">
<label for="resourceChoice">편집할 자료</label>
<select id="resourceChoice"></select>
<label for="resourceBadge">카드 상단 표시 문구</label>
<input id="resourceBadge" placeholder="연수 자료" maxlength="40">
<label for="resourceTitle">자료 제목</label>
<input id="resourceTitle" required maxlength="100">
<label for="resourceDescription">짧은 설명</label>
<input id="resourceDescription" required maxlength="300">
<label for="resourceBody">본문</label>
<textarea id="resourceBody" required></textarea>
<button class="primary">자료 저장</button>
<p id="resourceStatus" role="status"></p>
</form>
<section class="attachments" aria-label="첨부파일 관리">
<h3>첨부파일 관리</h3>
<p class="muted">위에서 선택한 자료에 파일을 추가합니다. 첨부파일은 이 브라우저에 저장됩니다.</p>
<div id="attachmentEditor"></div>
<label for="attachmentUpload">추가할 파일</label>
<input id="attachmentUpload" type="file" multiple>
<button id="attachmentAdd" type="button">파일 추가</button>
<p id="attachmentStatus" role="status"></p>
</section>
</details>
<details id="manage">
<summary>분류 관리</summary>
<p class="muted">이 브라우저에 분류를 저장합니다. 예시 자료가 있는 분류를 삭제하면 자료는 ‘미분류’에서 볼 수 있습니다.</p>
<form id="addGroup" class="row"><input aria-label="새 대분류 이름" placeholder="새 대분류 이름" required maxlength="40"><button>대분류 추가</button></form>
<div id="editor"></div>
<p id="manageStatus" role="status"></p>
</details>
</main>
<script>
'use strict';
const entries=[
 ['제미나이','그림자 놀이 아이디어','빛과 그림자를 몸으로 탐색하는 놀이를 준비해 보세요.',false,`너는 유치원 교사야. 만 5세 유아와 손전등, 흰 종이, 교실에 있는 물건으로 할 수 있는 그림자 놀이를 3가지 제안해 줘.

각 놀이에 준비물, 15분 이내의 진행 순서, 유아에게 던질 열린 질문 2개를 넣어 줘. 광원을 눈에 비추지 않는 안전 약속과 흐린 날 교실에서 할 수 있는 대안도 알려 줘.`],
 ['넷리파이','웹페이지를 링크로 공유하기','완성한 HTML을 웹에 올려 동료 교사와 공유하는 순서입니다.',true,`1. HTML 파일 이름을 index.html로 바꾸고 게시할 파일만 한 폴더에 모읍니다.
2. 넷리파이에서 정적 사이트를 수동으로 배포하는 기능을 찾아 폴더를 업로드합니다.
3. 배포 후 받은 주소를 시크릿 창과 휴대폰에서 열어 링크와 화면을 확인합니다.
4. 공유 전에 유아 이름, 얼굴 사진, 연락처 등 개인정보가 없는지 확인합니다.
5. 페이지를 고쳤다면 수정한 폴더를 다시 배포하고 같은 주소에서 변경 내용을 확인합니다.`],
 ['GPT','숲놀이 가정 안내문','준비물과 우천 시 계획을 담은 가정 안내문 초안을 만들어 보세요.',false,`너는 유치원 교사야. 보호자에게 보낼 숲놀이 안내문을 따뜻하고 간결한 말투로 작성해 줘.

일시 [날짜와 시간], 장소 [장소], 준비물 [편한 옷·운동화·물병], 우천 시 [대체 일정 또는 활동], 문의 [유치원 연락처]를 포함해 줘. 대괄호 안 내용은 임의로 채우지 말아 줘. 문자로 보낼 수 있는 짧은 버전도 함께 제안해 줘.`],
 ['미니홈피','우리 반 소개 페이지','학급의 하루와 놀이를 소개하는 작은 홈페이지를 만들어 보세요.',false,`유치원 [학급명] 소개 페이지를 HTML, CSS, JavaScript가 들어 있는 단일 HTML 파일로 만들어 줘.

환영 인사, 하루 일과, 좋아하는 놀이, 우리 반 약속을 넣고 휴대폰에서 잘 읽히게 만들어 줘. 실제 유아 이름이나 사진은 사용하지 말고, 내용은 교사가 쉽게 바꿀 수 있도록 예시 문구로 작성해 줘.`],
 ['잡동사니','AI 결과 검토 체크리스트','AI가 만든 자료를 우리 반에서 쓰기 전에 점검해 보세요.',true,`□ 사실: 날짜, 장소, 수치, 출처를 원래 자료와 대조했나요?
□ 적합성: 우리 반의 연령, 발달 수준, 관심에 맞나요?
□ 안전: 준비물과 활동 과정의 위험을 확인했나요?
□ 개인정보: 유아와 가족을 알아볼 수 있는 정보가 없나요?
□ 표현과 권리: 편견이 담긴 표현과 이미지·글의 사용 조건을 확인했나요?
□ 최종 확인: 교사가 직접 읽고 수정한 뒤 공유하나요?`]
];
const resourceKey = 'teacher-ai-seed-library:resources:v2';
let resourceEdits = {};
try {
  const saved = JSON.parse(localStorage.getItem(resourceKey));
  if (saved && typeof saved === 'object') resourceEdits = saved;
} catch {}

function getResource(index) {
  const original = entries[index];
  const edit = resourceEdits[index];
  if (!original || !edit || !['title', 'description', 'body'].every(field => typeof edit[field] === 'string' && edit[field].trim())) return original;
  return [original[0], edit.title, edit.description, original[3], edit.body];
}

const key='teacher-ai-seed-library:categories:v2';
const initial=()=>[{id:'training',name:'연수 자료',items:entries.map(([name],i)=>({id:'sample-'+i,name}))}];
let groups=initial(),storageIssue=false;
try{const raw=localStorage.getItem(key);if(raw){const data=JSON.parse(raw);if(Array.isArray(data)&&data.every(g=>g&&typeof g.id==='string'&&typeof g.name==='string'&&Array.isArray(g.items)&&g.items.every(i=>i&&typeof i.id==='string'&&typeof i.name==='string')))groups=data;}}catch{storageIssue=true;}
const $=id=>document.getElementById(id);
const el=(tag,value,cls)=>{const node=document.createElement(tag);if(value!==undefined)node.textContent=value;if(cls)node.className=cls;return node;};
const button=(name,fn,cls)=>{const b=el('button',name,cls);b.type='button';b.addEventListener('click',fn);return b;};
const all=()=>groups.flatMap(g=>g.items);
const missing=()=>entries.map((_,i)=>'sample-'+i).filter(id=>!all().some(x=>x.id===id));
let selected=all()[0]?.id||'unfiled';
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random();
async function save(message){try{await storeSection("categories",key,groups);storageIssue=false;}catch{storageIssue=true;}if(!all().some(x=>x.id===selected)&&!(selected==='unfiled'&&missing().length))selected=all()[0]?.id||'unfiled';render();edit();$('manageStatus').textContent=message+(storageIssue?' 브라우저가 저장을 허용하지 않아 이번 화면에만 적용됩니다.':'');}
function renderMenus(){const nav=$('menus');nav.replaceChildren();function menu(x,box){const b=button(x.name,()=>{selected=x.id;$('search').value='';render();Array.from(nav.querySelectorAll('button')).find(n=>n.dataset.id===selected)?.focus();});b.dataset.id=x.id;b.setAttribute('aria-pressed',String(selected===x.id&&!$('search').value.trim()));box.append(b);}
for(const g of groups){const wrap=el('div',undefined,'group'),row=el('div',undefined,'row');wrap.append(el('h3',g.name),row);for(const x of g.items)menu(x,row);if(!g.items.length)row.append(el('p','소분류를 추가해 보세요.','muted'));nav.append(wrap);}
if(missing().length){const box=el('div',undefined,'group row');menu({id:'unfiled',name:'미분류'},box);nav.append(box);}}
function render(){renderMenus();const terms=$('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),cards=$('cards');cards.replaceChildren();$('status').textContent='';const ids=terms.length?entries.map((_,i)=>'sample-'+i):selected==='unfiled'?missing():[selected];$('resultsTitle').textContent=terms.length?'검색 결과':(all().find(x=>x.id===selected)?.name||'미분류')+' 자료';for(const id of ids){const index=Number(id.match(/^sample-(\d+)$/)?.[1]);const entry=getResource(index);if(!entry)continue;const [topic,title,description,guide,body]=entry,g=groups.find(g=>g.items.some(x=>x.id===id)),category=g?.items.find(x=>x.id===id)?.name||'미분류';if(!terms.every(t=>[topic,title,description,body,category,g?.name].join(' ').toLowerCase().includes(t)))continue;const article=el('article'),details=el('details'),label=guide?'안내':'프롬프트',summary=el('summary',label+' 보기');details.append(summary,el('pre',body));details.addEventListener('toggle',()=>summary.textContent=label+(details.open?' 접기':' 보기'));const actions=el('div',undefined,'row'),link=el('a','자료 받기','action');link.href='data:text/plain;charset=utf-8,'+encodeURIComponent('\uFEFF'+title+'\n\n'+body);link.download=title+'.txt';actions.append(button('프롬프트 복사',()=>copy(body,article),'primary'),link);article.append(el('span',resourceEdits[index]?.badge || '연수 자료','badge'),el('h3',title),el('p',description),details,actions);showAttachments(article,index);cards.append(article);}if(!cards.children.length)cards.append(el('p',terms.length?'일치하는 자료가 없습니다. 다른 키워드로 검색해 보세요.':'이 분류에 등록된 자료가 없습니다.'));}
async function copy(body,article){try{await navigator.clipboard.writeText(body);$('status').textContent='본문을 복사했습니다.';return;}catch{}const area=article.querySelector('textarea')||el('textarea',undefined,'copy-fallback');area.value=body;area.readOnly=true;area.setAttribute('aria-label','복사할 본문');article.append(area);const previous=document.activeElement;area.select();let ok=false;try{ok=document.execCommand('copy');}catch{}if(ok){area.remove();previous?.focus();}else{area.focus();area.select();}$('status').textContent=ok?'본문을 복사했습니다.':'자동 복사가 제한되어 본문을 선택했습니다. 기기의 복사 기능을 사용해 주세요.';}
function field(value,label,action,onSubmit){const form=el('form',undefined,'row'),input=el('input');input.value=value;input.placeholder=label;input.setAttribute('aria-label',label);input.required=true;input.maxLength=40;input.addEventListener('input',()=>input.setCustomValidity(''));form.append(input,el('button',action));form.addEventListener('submit',e=>{e.preventDefault();const name=input.value.trim();if(!name){input.setCustomValidity('이름을 입력해 주세요.');input.reportValidity();return;}onSubmit(name);});return form;}
function edit(){const editor=$('editor');editor.replaceChildren();for(const g of groups){const box=el('div',undefined,'editor');const parent=field(g.name,'대분류 이름 수정','이름 저장',name=>{g.name=name;save('대분류 이름을 저장했습니다.');});parent.append(button('대분류 삭제',()=>{if(confirm('‘'+g.name+'’ 대분류와 그 아래 소분류를 삭제할까요?')){groups=groups.filter(x=>x!==g);save('대분류를 삭제했습니다.');}},'danger'));box.append(parent);for(const x of g.items){const f=field(x.name,'소분류 이름 수정','이름 저장',name=>{x.name=name;save('소분류 이름을 저장했습니다.');});f.classList.add('child');f.append(button('소분류 삭제',()=>{if(confirm('‘'+x.name+'’ 소분류를 삭제할까요?')){g.items=g.items.filter(y=>y!==x);save('소분류를 삭제했습니다.');}},'danger'));box.append(f);}box.append(field('','새 소분류 이름','소분류 추가',name=>{g.items.push({id:uid(),name});save('소분류를 추가했습니다.');}));editor.append(box);}}
$('addGroup').addEventListener('submit',e=>{e.preventDefault();const input=e.currentTarget.querySelector('input'),name=input.value.trim();if(!name){input.focus();$('manageStatus').textContent='대분류 이름을 입력해 주세요.';return;}groups.push({id:uid(),name,items:[]});input.value='';save('대분류를 추가했습니다.');});
$('search').addEventListener('input',render);edit();
const resourceChoice = $('resourceChoice');
for (const [index, [topic]] of entries.entries()) {
  const option = el('option', topic);
  option.value = String(index);
  resourceChoice.append(option);
}
function loadResourceForm() {
  const [, title, description, , body] = getResource(Number(resourceChoice.value));
  $('resourceBadge').value = resourceEdits[resourceChoice.value]?.badge || '연수 자료';
  $('resourceTitle').value = title;
  $('resourceDescription').value = description;
  $('resourceBody').value = body;
  $('resourceStatus').textContent = '';
}
resourceChoice.addEventListener('change', loadResourceForm);
$('resourceForm').addEventListener('submit', async event => {
  event.preventDefault();
  const title = $('resourceTitle').value.trim();
  const description = $('resourceDescription').value.trim();
  const body = $('resourceBody').value;
  if (!title || !description || !body.trim()) {
    $('resourceStatus').textContent = '제목, 설명, 본문을 모두 입력해 주세요.';
    return;
  }
  const badge = $('resourceBadge').value.trim() || '연수 자료';
  const next = { ...resourceEdits, [resourceChoice.value]: { title, description, body, badge } };
  try {
    await storeSection("resources", resourceKey, next);
  } catch {
    $('resourceStatus').textContent = '브라우저에서 저장하지 못했습니다. 입력한 내용은 편집 화면에 남아 있습니다.';
    return;
  }
  resourceEdits = next;
  render();
  loadResourceForm();
  $('resourceStatus').textContent = '자료를 저장했습니다.';
});
loadResourceForm();
const attachmentKey = 'teacher-ai-seed-library:attachments:v2';
let attachments = {};
try {
  attachments = JSON.parse(localStorage.getItem(attachmentKey)) || {};
} catch {}

function filesFor(index) {
  return attachments[index] || [];
}

function showAttachments(card, index) {
  const files = filesFor(index);
  if (!files.length) return;
  const section = el('section', undefined, 'attachments');
  const links = el('div', undefined, 'row');
  section.append(el('h4', '첨부파일'), links);
  for (const file of files) {
    const link = el('a', file.name, 'action');
    link.href = 'data:application/octet-stream;base64,' + file.data;
    link.download = file.name;
    links.append(link);
  }
  card.append(section);
}

async function saveAttachments(index, transform, message) {
  try {
    const current = online ? attachments : JSON.parse(localStorage.getItem(attachmentKey)) || {};
    const next = {...current, [index]: transform(current[index] || [])};
    await storeSection("attachments", attachmentKey, next);
    attachments = next;
    render();
    renderAttachmentEditor();
    $('attachmentStatus').textContent = message;
    return true;
  } catch (error) {
    $('attachmentStatus').textContent = error.name === 'QuotaExceededError'
      ? '브라우저의 저장 공간이 부족합니다. 작은 파일을 선택하거나 기존 첨부파일을 삭제해 주세요.'
      : '첨부파일을 저장하지 못했습니다. 다시 시도해 주세요.';
    return false;
  }
}

function readAttachment(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({id: uid(), name: file.name, data: reader.result.split(',')[1]});
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderAttachmentEditor() {
  const index = resourceChoice.value;
  const editor = $('attachmentEditor');
  editor.replaceChildren();
  for (const file of filesFor(index)) {
    const row = field(file.name, '첨부파일 이름', '이름 저장', name => {
      saveAttachments(index, files => files.map(item => item.id === file.id ? {...item, name} : item), '파일 이름을 저장했습니다.');
    });
    row.querySelector('input').maxLength = 255;
    const replacement = el('input');
    replacement.type = 'file';
    replacement.setAttribute('aria-label', file.name + ' 교체 파일 선택');
    row.append(
      replacement,
      button('파일 교체', async () => {
        const selectedFile = replacement.files[0];
        if (!selectedFile) {
          $('attachmentStatus').textContent = '교체할 파일을 선택해 주세요.';
          replacement.focus();
          return;
        }
        try {
          const updated = await readAttachment(selectedFile);
          saveAttachments(index, files => files.map(item => item.id === file.id ? {...updated, id: item.id} : item), '파일을 교체했습니다.');
        } catch {
          $('attachmentStatus').textContent = '교체할 파일을 읽지 못했습니다.';
        }
      }),
      button('파일 삭제', () => {
        if (confirm('‘' + file.name + '’ 파일을 삭제할까요?')) {
          saveAttachments(index, files => files.filter(item => item.id !== file.id), '파일을 삭제했습니다.');
        }
      }, 'danger')
    );
    editor.append(row);
  }
}

resourceChoice.addEventListener('change', () => {
  $('attachmentUpload').value = '';
  $('attachmentStatus').textContent = '';
  renderAttachmentEditor();
});
$('attachmentAdd').addEventListener('click', async () => {
  const index = resourceChoice.value;
  const upload = $('attachmentUpload');
  const files = Array.from(upload.files);
  if (!files.length) {
    $('attachmentStatus').textContent = '추가할 파일을 선택해 주세요.';
    upload.focus();
    return;
  }
  const add = $('attachmentAdd');
  add.disabled = true;
  try {
    const added = await Promise.all(files.map(readAttachment));
    if (await saveAttachments(index, previous => [...previous, ...added], '파일 ' + added.length + '개를 추가했습니다.') && resourceChoice.value === index) upload.value = '';
  } catch {
    $('attachmentStatus').textContent = '선택한 파일을 읽지 못했습니다.';
  } finally {
    add.disabled = false;
  }
});
renderAttachmentEditor();
render();
const online = typeof location !== 'undefined' && /^https?:$/.test(location.protocol);
let teacherId = null;
let libraryId = null;
let saveQueue = Promise.resolve();

async function api(path, method = 'GET', body) {
  const response = await fetch('/api/' + path, {
    method,
    headers: body === undefined ? {} : {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!response.ok) {
    const error = new Error('서버 요청 실패');
    error.status = response.status;
    if (response.status === 413) error.name = 'QuotaExceededError';
    throw error;
  }
  return response.json();
}

async function storeSection(section, localKey, value) {
  if (!online) {
    localStorage.setItem(localKey, JSON.stringify(value));
    return;
  }
  if (!teacherId || teacherId !== libraryId) throw new Error('편집 권한이 없습니다.');
  const pending = saveQueue.then(() => api('library/' + libraryId + '/' + section, 'PUT', value));
  saveQueue = pending.catch(() => {});
  await pending;
}

function libraryLink(id) {
  const link = new URL(location.pathname, location.origin);
  link.searchParams.set('library', id);
  return link.href;
}

async function loadLibrary() {
  $('account').hidden = false;
  $('resourceAdmin').hidden = true;
  $('manage').hidden = true;
  teacherId = (await api('session')).id;
  libraryId = new URLSearchParams(location.search).get('library') || teacherId;
  const links = $('accountLinks');
  links.replaceChildren();
  $('accountForm').hidden = Boolean(teacherId);
  $('accountForm').style.display = teacherId ? 'none' : '';
  if (teacherId) {
    const link = el('a','내 자료실 열기','action');
    link.href = libraryLink(teacherId);
    links.append(link,button('공유 링크 복사',async () => {
      try {
        await navigator.clipboard.writeText(libraryLink(teacherId));
        $('cloudStatus').textContent = '공유 링크를 복사했습니다. 이 링크로 자료를 열 수 있습니다.';
      } catch {
        $('cloudStatus').textContent = libraryLink(teacherId);
      }
    }),button('로그아웃',async () => {
      try {
        await saveQueue;
        await api('logout','POST');
        location.reload();
      } catch {
        $('cloudStatus').textContent = '로그아웃하지 못했습니다. 다시 시도해 주세요.';
      }
    }));
  }
  const state = libraryId ? await api('library/' + encodeURIComponent(libraryId)) : {};
  groups = state.categories || initial();
  resourceEdits = state.resources || {};
  attachments = state.attachments || {};
  selected = all()[0]?.id || 'unfiled';
  render();
  edit();
  loadResourceForm();
  renderAttachmentEditor();
  const canEdit = Boolean(teacherId && teacherId === libraryId);
  $('resourceAdmin').hidden = !canEdit;
  $('manage').hidden = !canEdit;
  $('cloudStatus').textContent = canEdit
    ? '변경 사항은 계정에 저장되며 공유 링크에 반영됩니다.'
    : '자료를 편집하려면 교사 계정으로 로그인해 내 자료실을 열어 주세요.';
}

if (online) {
  for (const action of ['signup','login']) {
    $(action).addEventListener('click', async () => {
      $('login').disabled = $('signup').disabled = true;
      try {
        const {id} = await api(action,'POST',{username:$('username').value.trim(),password:$('password').value});
        location.assign(libraryLink(id));
      } catch (error) {
        const messages = {
          400:'아이디는 영문·숫자 또는 _ . - 문자 3~40자, 비밀번호는 12~128자로 입력해 주세요.',
          401:'아이디와 비밀번호를 확인해 주세요.',
          409:'이미 사용 중인 아이디입니다.',
          429:'요청이 많습니다. 잠시 후 다시 시도해 주세요.'
        };
        $('cloudStatus').textContent = messages[error.status] || '서버에 연결하지 못했습니다. 다시 시도해 주세요.';
        $('login').disabled = $('signup').disabled = false;
      }
    });
  }
  loadLibrary().catch(error => {
    $('cards').replaceChildren();
    $('cloudStatus').textContent = error.status === 404 ? '자료실 링크를 확인해 주세요.' : '서버에 연결하지 못했습니다. 새로고침해 주세요.';
  });
}
</script>
</html>
